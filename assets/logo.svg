<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Hermes Skills Windows Ports">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1224"/>
      <stop offset="1" stop-color="#18203C"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.02"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.16"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame">
      <rect x="8" y="8" width="496" height="496" rx="104"/>
    </clipPath>
  </defs>

  <!-- window frame -->
  <g clip-path="url(#frame)">
    <rect x="8" y="8" width="496" height="496" rx="104" fill="url(#bg)"/>
    <rect x="8" y="8" width="496" height="496" rx="104" fill="url(#sheen)"/>
    <!-- title bar: the "window" cue, kept clear of the icons below -->
    <rect x="8" y="8" width="496" height="84" fill="#FFFFFF" fill-opacity="0.045"/>
    <line x1="8" y1="92" x2="504" y2="92" stroke="#8FB6FF" stroke-opacity="0.16" stroke-width="2"/>
  </g>
  <rect x="9.5" y="9.5" width="493" height="493" rx="102.5" fill="none" stroke="#38BDF8" stroke-opacity="0.38" stroke-width="3"/>

  <!-- window controls, tinted with the three skill accents -->
  <g>
    <circle cx="68" cy="50" r="7" fill="#38BDF8" fill-opacity="0.75"/>
    <circle cx="104" cy="50" r="7" fill="#A78BFA" fill-opacity="0.75"/>
    <circle cx="140" cy="50" r="7" fill="#FBBF24" fill-opacity="0.75"/>
  </g>

  <!-- pane 1: search -->
  <g transform="translate(112,250)">
    <rect x="-56" y="-56" width="112" height="112" rx="30" fill="#38BDF8" fill-opacity="0.10" stroke="#38BDF8" stroke-opacity="0.55" stroke-width="3"/>
    <g fill="none" stroke="#38BDF8" stroke-width="8" stroke-linecap="round" filter="url(#glow)">
      <circle cx="-6" cy="-6" r="25"/>
      <line x1="12" y1="12" x2="30" y2="30"/>
    </g>
  </g>

  <!-- pane 2: security -->
  <g transform="translate(256,250)">
    <rect x="-56" y="-56" width="112" height="112" rx="30" fill="#A78BFA" fill-opacity="0.10" stroke="#A78BFA" stroke-opacity="0.55" stroke-width="3"/>
    <path d="M 0 -32 L 26 -21 L 26 2 Q 26 25 0 33 Q -26 25 -26 2 L -26 -21 Z"
          fill="none" stroke="#A78BFA" stroke-width="8" stroke-linejoin="round" filter="url(#glow)"/>
  </g>

  <!-- pane 3: papers -->
  <g transform="translate(400,250)">
    <rect x="-56" y="-56" width="112" height="112" rx="30" fill="#FBBF24" fill-opacity="0.10" stroke="#FBBF24" stroke-opacity="0.55" stroke-width="3"/>
    <g filter="url(#glow)">
      <rect x="-22" y="-30" width="44" height="60" rx="8" fill="none" stroke="#FBBF24" stroke-width="8"/>
      <g stroke="#FBBF24" stroke-width="6" stroke-linecap="round">
        <line x1="-12" y1="-12" x2="12" y2="-12"/>
        <line x1="-12" y1="0" x2="12" y2="0"/>
        <line x1="-12" y1="12" x2="4" y2="12"/>
      </g>
    </g>
  </g>

  <!-- labels -->
  <g font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="23" font-weight="600" text-anchor="middle" letter-spacing="1.4">
    <text x="112" y="344" fill="#38BDF8">SEARCH</text>
    <text x="256" y="344" fill="#A78BFA">SECURITY</text>
    <text x="400" y="344" fill="#FBBF24">PAPERS</text>
  </g>

  <!-- title -->
  <g font-family="Segoe UI, Inter, system-ui, sans-serif" text-anchor="middle">
    <text x="256" y="412" fill="#EAF1FB" font-size="30" font-weight="700">Hermes Skills</text>
    <text x="256" y="450" fill="#8FB6FF" font-size="21" font-weight="500" letter-spacing="3">WINDOWS PORTS</text>
  </g>
</svg>
